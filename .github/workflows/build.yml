name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare project structure
        run: |
          mkdir -p app/src/main/java/com/aimruler
          find . -path ./app -prune -o -path ./.git -prune -o -name '*.java' -type f -exec mv {} app/src/main/java/com/aimruler/ \;
          M=$(find . -path ./app -prune -o -name AndroidManifest.xml -type f -print | head -1)
          if [ -z "$M" ] || ! ls app/src/main/java/com/aimruler/*.java >/dev/null 2>&1; then
            echo "ОШИБКА: в репозитории нет файлов .java или AndroidManifest.xml. Загрузите их через Add file - Upload files."
            exit 1
          fi
          mv "$M" app/src/main/AndroidManifest.xml
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.aimruler'
              compileSdk 34
              defaultConfig { applicationId 'com.aimruler'; minSdk 24; targetSdk 34; versionCode 1; versionName '1.0' }
              compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
          }
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.2.2' apply false }
          EOF
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "AimRuler"
          include ':app'
          EOF
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.5 }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: aim-ruler-apk, path: app/build/outputs/apk/debug/app-debug.apk }
